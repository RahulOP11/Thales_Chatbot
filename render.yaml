services:
  - type: web
    name: thales-chatbot
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python src/utils/download_textbooks.py
      python build_vectorstore.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-base
      - key: CHROMA_PERSIST_DIR
        value: ./vectorstore
      - key: CHUNK_SIZE
        value: 1000
      - key: CHUNK_OVERLAP
        value: 200
      - key: TOP_K
        value: 5
      - key: SIMILARITY_THRESHOLD
        value: 0.7
      - key: TEMPERATURE
        value: 0.3
